<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peppa & Friends Toddler Coloring Book (20 Pages)</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#7DD3FC">
<style>
  :root {
    --sky-top: #7DD3FC;
    --sky-bottom: #E0F2FE;
    --panel-bg: #FFFBEB;
    --border-ink: #1E293B;
    --accent-pink: #F472B6;
    --accent-yellow: #FBBF24;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    padding: 8px;
    gap: 8px;
  }

  /* Top Scrollable Bar: 20 Pages + Yay + Save */
  #top-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-bg);
    border: 4px solid var(--border-ink);
    border-radius: 22px;
    padding: 5px 10px;
    box-shadow: 0 4px 0 rgba(30, 41, 59, 0.25);
    flex-shrink: 0;
    min-height: 68px;
  }

  #page-scroller {
    display: flex;
    align-items: center;
    gap: 7px;
    overflow-x: auto;
    overflow-y: hidden;
    flex: 1;
    padding: 2px 4px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #page-scroller::-webkit-scrollbar {
    display: none;
  }

  .page-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border: 3px solid var(--border-ink);
    border-radius: 15px;
    padding: 3px 9px;
    min-width: 68px;
    height: 52px;
    cursor: pointer;
    transition: transform 0.1s, background-color 0.15s;
    box-shadow: 0 3px 0 var(--border-ink);
    flex-shrink: 0;
    position: relative;
  }

  .page-btn:active {
    transform: translateY(2px) scale(0.96);
    box-shadow: 0 1px 0 var(--border-ink);
  }

  .page-btn.active {
    background: #FDE047;
    border-color: #BE185D;
    box-shadow: 0 3px 0 #BE185D;
  }

  .page-num-badge {
    position: absolute;
    top: -4px;
    left: -4px;
    background: #EC4899;
    color: #FFFFFF;
    font-size: 10px;
    font-weight: 900;
    border: 2px solid var(--border-ink);
    border-radius: 99px;
    padding: 0 5px;
    line-height: 13px;
  }

  .page-btn .icon {
    font-size: 21px;
    line-height: 1.1;
  }

  .page-btn .label {
    font-size: 10px;
    font-weight: 900;
    color: var(--border-ink);
    white-space: nowrap;
    max-width: 64px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }

  .action-btn {
    border: 3px solid var(--border-ink);
    border-radius: 16px;
    padding: 6px 11px;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--border-ink);
    display: flex;
    align-items: center;
    gap: 4px;
    height: 50px;
  }

  .action-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--border-ink);
  }

  #btn-celebrate { background: #4ADE80; color: #064E3B; }
  #btn-save { background: #38BDF8; color: #0C4A6E; }
  #btn-sound { background: #FDBA74; color: #7C2D12; }

  /* Main Workspace */
  #workspace {
    display: flex;
    flex: 1;
    gap: 8px;
    min-height: 0;
  }

  /* Left Tools Sidebar */
  #tools-panel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--panel-bg);
    border: 4px solid var(--border-ink);
    border-radius: 22px;
    padding: 7px 6px;
    width: 78px;
    flex-shrink: 0;
    box-shadow: 0 4px 0 rgba(30, 41, 59, 0.25);
  }

  .tool-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }

  .tool-btn {
    width: 60px;
    height: 52px;
    border: 3px solid var(--border-ink);
    border-radius: 15px;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--border-ink);
    padding: 2px;
  }

  .tool-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--border-ink);
  }

  .tool-btn.active {
    background: #F472B6;
    color: #FFFFFF;
    transform: scale(1.04);
  }

  .tool-btn .t-icon { font-size: 22px; line-height: 1; }
  .tool-btn .t-name { font-size: 10px; font-weight: 900; margin-top: 2px; }

  #sticker-tray {
    display: none;
    flex-direction: column;
    gap: 4px;
    align-items: center;
    background: #FEF3C7;
    border: 2px dashed #D97706;
    border-radius: 12px;
    padding: 3px;
  }

  #sticker-tray.visible {
    display: flex;
  }

  .sticker-opt {
    font-size: 20px;
    width: 44px;
    height: 30px;
    border-radius: 8px;
    border: 2px solid transparent;
    background: #FFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .sticker-opt.active {
    border-color: #BE185D;
    background: #FBCFE8;
  }

  /* Center Drawing Board */
  #canvas-container {
    flex: 1;
    background: #FFFFFF;
    border: 5px solid var(--border-ink);
    border-radius: 26px;
    box-shadow: 0 6px 0 rgba(30, 41, 59, 0.25);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #page-title-pill {
    position: absolute;
    top: 10px;
    left: 12px;
    background: rgba(254, 240, 138, 0.94);
    border: 3px solid var(--border-ink);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 900;
    color: var(--border-ink);
    pointer-events: none;
    z-index: 5;
  }

  #coloring-svg {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
    cursor: pointer;
  }

  .colorable {
    transition: fill 0.15s ease;
    cursor: pointer;
  }

  /* Right Palette Sidebar */
  #palette-panel {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    background: var(--panel-bg);
    border: 4px solid var(--border-ink);
    border-radius: 22px;
    padding: 7px;
    width: 112px;
    flex-shrink: 0;
    box-shadow: 0 4px 0 rgba(30, 41, 59, 0.25);
    align-content: center;
  }

  .swatch {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid var(--border-ink);
    cursor: pointer;
    box-shadow: 0 3px 0 var(--border-ink);
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    justify-self: center;
  }

  .swatch.active {
    transform: scale(1.17);
    border: 4px solid #111827;
    box-shadow: 0 0 0 3px #FDE047, 0 4px 0 var(--border-ink);
  }

  /* Confirmation Overlay */
  #confirm-overlay, #confetti-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }

  #confirm-overlay {
    background: rgba(15, 23, 42, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }

  #confirm-overlay.open { display: flex; }

  .confirm-card {
    background: #FFFBEB;
    border: 5px solid var(--border-ink);
    border-radius: 28px;
    padding: 22px 28px;
    text-align: center;
    box-shadow: 0 8px 0 var(--border-ink);
  }

  .confirm-card h2 {
    margin: 0 0 16px 0;
    font-size: 24px;
    color: var(--border-ink);
  }

  .confirm-btns {
    display: flex;
    gap: 18px;
    justify-content: center;
  }

  .big-choice {
    font-size: 28px;
    padding: 12px 26px;
    border-radius: 20px;
    border: 4px solid var(--border-ink);
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--border-ink);
  }

  #confirm-yes { background: #4ADE80; }
  #confirm-no { background: #F87171; }

  /* Portrait Tablet Adaptation */
  @media (orientation: portrait) {
    #workspace {
      flex-direction: column;
    }
    #tools-panel {
      flex-direction: row;
      width: 100%;
      height: 68px;
      padding: 5px 8px;
    }
    .tool-group {
      flex-direction: row;
    }
    #sticker-tray {
      flex-direction: row;
    }
    #palette-panel {
      grid-template-columns: repeat(7, 1fr);
      width: 100%;
      height: 98px;
      padding: 6px;
    }
    .swatch {
      width: 38px;
      height: 38px;
    }
  }
</style>
</head>
<body>
<div id="app">
  <!-- Top Bar: 20 Scrollable Pages + Celebration & Save -->
  <header id="top-bar">
    <div id="page-scroller" aria-label="20 Coloring Sheets"></div>
    <div class="top-actions">
      <button class="action-btn" id="btn-sound" title="Sound Toggle">🔊</button>
      <button class="action-btn" id="btn-celebrate" title="Celebrate!">🎉 YAY!</button>
      <button class="action-btn" id="btn-save" title="Save Picture">📸</button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main id="workspace">
    <!-- Left Tools -->
    <aside id="tools-panel">
      <div class="tool-group">
        <button class="tool-btn active" id="tool-fill" data-tool="fill">
          <span class="t-icon">🪣</span>
          <span class="t-name">TAP FILL</span>
        </button>
        <button class="tool-btn" id="tool-crayon" data-tool="crayon">
          <span class="t-icon">🖍️</span>
          <span class="t-name">CRAYON</span>
        </button>
        <button class="tool-btn" id="tool-sticker" data-tool="sticker">
          <span class="t-icon">✨</span>
          <span class="t-name">STICKER</span>
        </button>
        <div id="sticker-tray">
          <button class="sticker-opt active" data-sticker="⭐">⭐</button>
          <button class="sticker-opt" data-sticker="❤️">❤️</button>
          <button class="sticker-opt" data-sticker="🌸">🌸</button>
          <button class="sticker-opt" data-sticker="💦">💦</button>
        </div>
      </div>

      <div class="tool-group">
        <button class="tool-btn" id="tool-undo">
          <span class="t-icon">↩️</span>
          <span class="t-name">UNDO</span>
        </button>
        <button class="tool-btn" id="tool-eraser" data-tool="eraser">
          <span class="t-icon">🧼</span>
          <span class="t-name">ERASE</span>
        </button>
        <button class="tool-btn" id="tool-clear">
          <span class="t-icon">🗑️</span>
          <span class="t-name">NEW</span>
        </button>
      </div>
    </aside>

    <!-- Center Coloring Canvas -->
    <section id="canvas-container">
      <div id="page-title-pill">1. Peppa's Muddy Puddle</div>
      <svg id="coloring-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>

    <!-- Right Toddler Color Palette -->
    <aside id="palette-panel"></aside>
  </main>
</div>

<!-- Kid-Friendly Reset Modal -->
<div id="confirm-overlay">
  <div class="confirm-card">
    <h2>Start this page fresh? 🧼</h2>
    <div class="confirm-btns">
      <button class="big-choice" id="confirm-yes">✅ YES</button>
      <button class="big-choice" id="confirm-no">❌ NO</button>
    </div>
  </div>
</div>

<!-- Celebration Confetti Canvas -->
<canvas id="confetti-overlay"></canvas>

<script>
(() => {
  const PALETTE = [
    { name: 'Peppa Pink', hex: '#FF85B3' },
    { name: 'Dark Pink', hex: '#EC4899' },
    { name: 'Peppa Red', hex: '#EF4444' },
    { name: 'Sunny Yellow', hex: '#FACC15' },
    { name: 'George Blue', hex: '#38BDF8' },
    { name: 'Daddy Aqua', hex: '#2DD4BF' },
    { name: 'Grass Green', hex: '#4ADE80' },
    { name: 'Dino Green', hex: '#16A34A' },
    { name: 'Orange', hex: '#FB923C' },
    { name: 'Mummy Orange', hex: '#F97316' },
    { name: 'Purple', hex: '#C084FC' },
    { name: 'Muddy Brown', hex: '#92400E' },
    { name: 'Teddy Tan', hex: '#D97706' },
    { name: 'Soft Grey', hex: '#CBD5E1' }
  ];

  let currentColor = PALETTE[0].hex;
  let currentTool = 'fill';
  let currentSticker = '⭐';
  let currentPageIndex = 0;
  let soundEnabled = true;
  let isDrawing = false;
  let activeStroke = null;
  let undoStack = [];

  const svg = document.getElementById('coloring-svg');
  const pageScroller = document.getElementById('page-scroller');
  const pageTitlePill = document.getElementById('page-title-pill');
  const palettePanel = document.getElementById('palette-panel');
  const stickerTray = document.getElementById('sticker-tray');
  const confirmOverlay = document.getElementById('confirm-overlay');
  const confettiCanvas = document.getElementById('confetti-overlay');
  const confettiCtx = confettiCanvas.getContext('2d');

  // Web Audio API Sound Effects
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playPopSound(freq = 440) {
    if (!soundEnabled) return;
    const ctx = getAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.45, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  }

  function playSparkleSound() {
    if (!soundEnabled) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
      setTimeout(() => playPopSound(f), idx * 55);
    });
  }

  function playFanfare() {
    if (!soundEnabled) return;
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    notes.forEach((n, i) => setTimeout(() => playPopSound(n), i * 110));
  }

  // =========================================================================
  // REUSABLE VECTOR CHARACTER BUILDERS (Heads seamlessly connected to bodies!)
  // =========================================================================

  function skySunCloud(includePuddle = false) {
    return `
      <rect class="colorable" x="0" y="0" width="800" height="445" fill="#FFFFFF"/>
      <rect class="colorable" x="0" y="445" width="800" height="155" fill="#FFFFFF" stroke="#1E293B" stroke-width="5"/>
      <!-- Sun -->
      <circle class="colorable" cx="105" cy="95" r="46" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
      <g stroke="#1E293B" stroke-width="6" stroke-linecap="round">
        <line x1="105" y1="26" x2="105" y2="40"/><line x1="105" y1="150" x2="105" y2="164"/>
        <line x1="36" y1="95" x2="50" y2="95"/><line x1="160" y1="95" x2="174" y2="95"/>
        <line x1="56" y1="46" x2="66" y2="56"/><line x1="144" y1="134" x2="154" y2="144"/>
        <line x1="154" y1="46" x2="144" y2="56"/><line x1="66" y1="134" x2="56" y2="144"/>
      </g>
      <!-- Cloud -->
      <path class="colorable" d="M 565 110 C 545 110, 535 90, 550 76 C 555 52, 592 48, 608 66 C 625 46, 665 54, 668 78 C 688 84, 685 110, 662 110 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="6" stroke-linejoin="round"/>
      ${includePuddle ? `<ellipse class="colorable" cx="400" cy="525" rx="235" ry="46" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>` : ''}
    `;
  }

  // Peppa Pig (Head lowered by 22px so chin overlaps dress collar cleanly)
  function drawPeppa(x, y, s = 1, flip = false) {
    const tf = flip ? `translate(${x},${y}) scale(${-s},${s})` : `translate(${x},${y}) scale(${s})`;
    return `
    <g transform="${tf}">
      <path d="M -68 75 C -96 72, -96 42, -78 46 C -64 50, -76 76, -98 66" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
      <line x1="-26" y1="115" x2="-26" y2="155" stroke="#1E293B" stroke-width="7"/>
      <line x1="26" y1="115" x2="26" y2="155" stroke="#1E293B" stroke-width="7"/>
      <ellipse class="colorable" cx="-34" cy="162" rx="22" ry="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
      <ellipse class="colorable" cx="18" cy="162" rx="22" ry="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
      <path d="M -52 38 L -98 15 M -98 15 L -112 4 M -98 15 L -114 22" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
      <path d="M 52 38 L 98 15 M 98 15 L 112 4 M 98 15 L 114 22" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
      <!-- Dress -->
      <path class="colorable" d="M -46 4 L 46 4 L 74 115 L -74 115 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="6" stroke-linejoin="round"/>
      <!-- Head Group (Connected to Dress) -->
      <g transform="translate(0, 22)">
        <ellipse class="colorable" cx="-16" cy="-126" rx="12" ry="25" transform="rotate(-12 -16 -126)" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
        <ellipse class="colorable" cx="18" cy="-124" rx="12" ry="25" transform="rotate(10 18 -124)" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
        <path class="colorable" d="M -60 -52 C -62 -98, -22 -114, 18 -105 L 72 -96 C 95 -92, 98 -55, 74 -50 L 34 -44 C 24 -12, -55 -8, -60 -52 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="6" stroke-linejoin="round"/>
        <ellipse class="colorable" cx="80" cy="-73" rx="14" ry="22" transform="rotate(12 80 -73)" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
        <circle cx="76" cy="-77" r="3.5" fill="#1E293B"/><circle cx="85" cy="-72" r="3.5" fill="#1E293B"/>
        <circle cx="-18" cy="-82" r="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/><circle cx="-16" cy="-82" r="4.5" fill="#1E293B"/>
        <circle cx="14" cy="-80" r="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/><circle cx="16" cy="-80" r="4.5" fill="#1E293B"/>
        <circle class="colorable" cx="-32" cy="-52" r="15" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
        <path d="M -12 -44 Q 6 -28 24 -44" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>`;
  }

  // George Pig (Head lowered by 20px to meet tunic cleanly)
  function drawGeorge(x, y, s = 0.85, flip = false) {
    const tf = flip ? `translate(${x},${y}) scale(${-s},${s})` : `translate(${x},${y}) scale(${s})`;
    return `
    <g transform="${tf}">
      <path d="M -56 68 C -80 65, -80 40, -64 44 C -52 48, -62 68, -80 60" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
      <line x1="-22" y1="100" x2="-22" y2="136" stroke="#1E293B" stroke-width="7"/>
      <line x1="22" y1="100" x2="22" y2="136" stroke="#1E293B" stroke-width="7"/>
      <ellipse class="colorable" cx="-28" cy="142" rx="20" ry="11" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
      <ellipse class="colorable" cx="16" cy="142" rx="20" ry="11" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
      <path d="M -44 34 L -84 18 M -84 18 L -96 8 M -84 18 L -98 25" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
      <path d="M 44 34 L 84 18 M 84 18 L 96 8 M 84 18 L 98 25" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
      <!-- Tunic -->
      <path class="colorable" d="M -40 4 L 40 4 L 62 100 L -62 100 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="6" stroke-linejoin="round"/>
      <!-- Head Group -->
      <g transform="translate(0, 20)">
        <ellipse class="colorable" cx="-14" cy="-112" rx="11" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
        <ellipse class="colorable" cx="16" cy="-110" rx="11" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
        <path class="colorable" d="M -54 -46 C -56 -88, -20 -102, 16 -94 L 64 -86 C 85 -82, 88 -48, 66 -44 L 30 -38 C 20 -10, -50 -6, -54 -46 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
        <ellipse class="colorable" cx="72" cy="-65" rx="13" ry="19" transform="rotate(10 72 -65)" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>
        <circle cx="68" cy="-68" r="3" fill="#1E293B"/><circle cx="76" cy="-64" r="3" fill="#1E293B"/>

    if (!undoStack.length) return;
    const action = undoStack.pop();
    if (action.type === 'fill') {
      action.el.setAttribute('fill', action.prevFill);
    } else if (action.type === 'add') {
      action.el.remove();
    } else if (action.type === 'remove') {
      const layer = document.getElementById('freehand-layer');
      if (layer) layer.appendChild(action.el);
    }
    playPopSound(340);

    document.querySelectorAll('.page-btn').forEach((b, i) => {

      if (i === index) b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

    pageTitlePill.textContent = PAGES[index].title;
    svg.innerHTML = `

      <g id="freehand-layer"></g>
      <g id="fx-layer" pointer-events="none"></g>
    `;

  // Coordinate helper for SVG
  function getSvgPoint(evt) {
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return { x: 400, y: 300 };
    return pt.matrixTransform(ctm.inverse());
  }

    const fxLayer = document.getElementById('fx-layer');
    if (!fxLayer) return;
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI * 2 * i) / 6;
      const star = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      star.setAttribute('cx', x);
      star.setAttribute('cy', y);
      star.setAttribute('r', '7');
      star.setAttribute('fill', color);
      star.setAttribute('stroke', '#1E293B');
      star.setAttribute('stroke-width', '2');
      fxLayer.appendChild(star);

      let frame = 0;
      const anim = () => {
        frame++;
        star.setAttribute('cx', x + Math.cos(angle) * frame * 4);
        star.setAttribute('cy', y + Math.sin(angle) * frame * 4);
        star.setAttribute('r', Math.max(0.5, 7 - frame * 0.45));
        if (frame < 14) requestAnimationFrame(anim);
        else star.remove();
      };
      requestAnimationFrame(anim);
    }
  }

  // Unified Pointer Handling on SVG
  svg.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const pt = getSvgPoint(e);
    const freehandLayer = document.getElementById('freehand-layer');

    if (currentTool === 'fill') {
      const target = e.target;
      if (target && target.classList && target.classList.contains('colorable')) {
        const prevFill = target.getAttribute('fill') || '#FFFFFF';
        if (prevFill !== currentColor) {
          undoStack.push({ type: 'fill', el: target, prevFill });
          target.setAttribute('fill', currentColor);
        }
        playSparkleSound();
        spawnTapSparkle(pt.x, pt.y, currentColor);
      }
    } else if (currentTool === 'crayon') {
      isDrawing = true;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', currentColor);
      path.setAttribute('stroke-width', '20');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('opacity', '0.92');
      path.classList.add('freehand-item');
      freehandLayer.appendChild(path);
      activeStroke = path;
      undoStack.push({ type: 'add', el: path });
      playPopSound(480);
    } else if (currentTool === 'sticker') {
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', pt.x);
      txt.setAttribute('y', pt.y);
      txt.setAttribute('font-size', '56');
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('dominant-baseline', 'central');
      txt.textContent = currentSticker;
      txt.classList.add('freehand-item');
      freehandLayer.appendChild(txt);
      undoStack.push({ type: 'add', el: txt });
      playSparkleSound();
      spawnTapSparkle(pt.x, pt.y, '#FACC15');
    } else if (currentTool === 'eraser') {
      eraseAt(e.target, pt);
    }
  });

  svg.addEventListener('pointermove', (e) => {
    if (!isDrawing && currentTool !== 'eraser') return;
    const pt = getSvgPoint(e);
    if (currentTool === 'crayon' && isDrawing && activeStroke) {
      const d = activeStroke.getAttribute('d');
      activeStroke.setAttribute('d', `${d} L ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`);
    } else if (currentTool === 'eraser' && e.buttons > 0) {
      eraseAt(e.target, pt);
    }
  });

  window.addEventListener('pointerup', () => {
    isDrawing = false;
    activeStroke = null;
  });

  function eraseAt(target, pt) {
    if (target && target.classList && target.classList.contains('freehand-item')) {
      undoStack.push({ type: 'remove', el: target });
      target.remove();
      playPopSound(300);
      return;
    }
    if (target && target.classList && target.classList.contains('colorable')) {
      const prevFill = target.getAttribute('fill') || '#FFFFFF';
      if (prevFill !== '#FFFFFF') {
        undoStack.push({ type: 'fill', el: target, prevFill });
        target.setAttribute('fill', '#FFFFFF');
        playPopSound(320);
      }
    }
    document.querySelectorAll('.freehand-item').forEach(item => {
      const bbox = item.getBBox();
      if (pt.x >= bbox.x - 16 && pt.x <= bbox.x + bbox.width + 16 &&
          pt.y >= bbox.y - 16 && pt.y <= bbox.y + bbox.height + 16) {
        undoStack.push({ type: 'remove', el: item });
        item.remove();
      }
    });
  }

  // Clear / Reset Confirmation Modal
  document.getElementById('tool-clear').addEventListener('pointerdown', () => {
    playPopSound(400);
    confirmOverlay.classList.add('open');
  });

  document.getElementById('confirm-no').addEventListener('pointerdown', () => {
    confirmOverlay.classList.remove('open');
    playPopSound(350);
  });

  document.getElementById('confirm-yes').addEventListener('pointerdown', () => {
    confirmOverlay.classList.remove('open');
    loadPage(currentPageIndex);
    playSparkleSound();
  });

  // Celebration Confetti Animation
  let confettiPieces = [];
  let confettiAnimId = null;

  function launchConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
    confettiPieces = [];
    const colors = ['#FF85B3', '#FACC15', '#38BDF8', '#4ADE80', '#FB923C', '#C084FC'];
    for (let i = 0; i < 120; i++) {
      confettiPieces.push({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * 200,
        w: 10 + Math.random() * 10,
        h: 10 + Math.random() * 10,
        vx: (Math.random() - 0.5) * 5,
        vy: 3 + Math.random() * 5,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 10,
        color: colors[i % colors.length]
      });
    }
    if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
    animateConfetti();
  }

  function animateConfetti() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    confettiPieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      if (p.y < confettiCanvas.height + 30) alive = true;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate((p.rot * Math.PI) / 180);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      confettiCtx.restore();
    });
    if (alive) {
      confettiAnimId = requestAnimationFrame(animateConfetti);
    } else {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  document.getElementById('btn-celebrate').addEventListener('pointerdown', () => {
    playFanfare();
    launchConfetti();
  });

  // Save Artwork as PNG directly on local tablet
  document.getElementById('btn-save').addEventListener('pointerdown', () => {
    playSparkleSound();
    launchConfetti();
    const serializer = new XMLSerializer();
    const clone = svg.cloneNode(true);
    const fx = clone.querySelector('#fx-layer');
    if (fx) fx.remove();
    const svgStr = serializer.serializeToString(clone);
    const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.onload = () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 1200;
      exportCanvas.height = 900;
      const ctx = exportCanvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 1200, 900);
      ctx.drawImage(img, 0, 0, 1200, 900);
      URL.revokeObjectURL(url);

      const link = document.createElement('a');
      link.download = `${PAGES[currentPageIndex].id}-coloring.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    };
    img.src = url;
  });

  // Initialize Page 1
  loadPage(0);
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

</script>
